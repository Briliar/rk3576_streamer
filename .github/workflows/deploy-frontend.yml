name: Deploy Frontend to ECS

on:
  push:
    branches:
      - feature/person-snapshot
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}

      - name: Add ECS host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.ECS_SSH_PORT }}" -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync frontend files to ECS
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.ECS_SSH_PORT }}" \
            frontend/ \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/rk3576-streamer/"

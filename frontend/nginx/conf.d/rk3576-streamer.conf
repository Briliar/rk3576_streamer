server {
    listen 80;
    server_name _;

    root /var/www/rk3576-streamer;
    index index.html;

    access_log /var/log/nginx/rk3576-streamer.access.log;
    error_log /var/log/nginx/rk3576-streamer.error.log;

    location = /monitor {
        return 302 /monitor/;
    }

    location /monitor/ {
        alias /var/www/rk3576-streamer/;
        try_files $uri $uri/ /monitor/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}